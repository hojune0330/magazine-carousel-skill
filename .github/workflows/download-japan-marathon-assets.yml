name: Build Japan Marathon Image Bundle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/download-japan-marathon-assets.yml'
      - 'downloads/japan-marathon-assets/REQUEST.md'

permissions:
  contents: read

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Wikimedia Commons originals and build bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import json
          import re
          import shutil
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          USER_AGENT = 'io-magazine-carousel-skill/3.2 (GitHub Actions image bundler)'
          API = 'https://commons.wikimedia.org/w/api.php'
          OUT = Path('bundle')
          OUT.mkdir(parents=True, exist_ok=True)

          assets = [
              {
                  'filename': '01_mgc_elite_group.jpg',
                  'title': 'Marathon Grand Championship 190915.jpg',
                  'use': '1장 표지 — 일본 엘리트 선수층',
              },
              {
                  'filename': '02_tokyo_marathon_three_runners.jpg',
                  'title': 'Tokyo Marathon 2019 Runner (32321717927).jpg',
                  'use': '2장 — 일본의 두꺼운 기록대',
              },
              {
                  'filename': '05_tokyo_marathon_depth.jpg',
                  'title': 'Tokyo Marathon 2019 Runner (46348723405).jpg',
                  'use': '5장 — 일본의 기록 밀집',
              },
              {
                  'filename': '06_kengo_suzuki_portrait.jpg',
                  'title': 'Kengo Suzuki 190915.jpg',
                  'use': '6장 — 비와코 마라톤과 스즈키 켄고',
              },
              {
                  'filename': '07_asahi_kuroda_hakone.jpg',
                  'title': '2026 Hakone Ekiden Asahi Kuroda 20260102.jpg',
                  'use': '7장 — 하코네에서 마라톤으로 이어지는 파이프라인',
              },
              {
                  'filename': '09_mgc_group_kayabacho.jpg',
                  'title': 'Marathon Grand Championship マラソングランドチャンピオンシップ (@ kayabacho 茅場町) (48735319826).jpg',
                  'use': '9장 — 초고성능 중산층과 MGC 선수 집단',
              },
              {
                  'filename': '11a_suguru_osako.jpg',
                  'title': 'Suguru Osako 190915.jpg',
                  'use': '11장 — Project EXCEED / 오사코 스구루',
              },
              {
                  'filename': '11b_yuta_shitara.jpg',
                  'title': 'Yuta Shitara 190915.jpg',
                  'use': '11장 — Project EXCEED / 시타라 유타',
              },
              {
                  'filename': '12_corporate_runners_mgc.jpg',
                  'title': 'Marathon Grand Championship マラソングランドチャンピオンシップ (@ takebashi 竹橋 気象庁前交差点) (48735479697).jpg',
                  'use': '12장 — 실업단 선수 집단',
              },
              {
                  'filename': '13_mgc_race_action.jpg',
                  'title': 'Marathon Grand Championship 190915a3.jpg',
                  'use': '13장 — MGC 레이스',
              },
              {
                  'filename': '14_hakone_ekiden_landscape.jpg',
                  'title': 'Hakone Ekiden 2026 (98111).jpg',
                  'use': '14장 — 하코네 에키덴',
              },
              {
                  'filename': '15a_vaporfly_carbon_plate.png',
                  'title': 'Nike Vaporfly Cut in Half.png',
                  'use': '15장 — 카본 플레이트 구조',
              },
              {
                  'filename': '15b_adios_pro_3.jpg',
                  'title': 'Adizero Adios Pro 3.jpg',
                  'use': '15장 — 현대 슈퍼슈즈',
              },
              {
                  'filename': '17_kengo_suzuki_berlin.jpg',
                  'title': 'Kengo Suzuki at Berlin-Marathon 2025-09-21 04.jpg',
                  'use': '17장 — 세계 무대의 일본 엘리트',
              },
              {
                  'filename': '18_hakone_tasuki_runner.jpg',
                  'title': 'Hakone Ekiden 2023 (53080595752).jpg',
                  'use': '18장 — 에키덴과 타스키',
              },
              {
                  'filename': '18b_hakone_vertical.jpg',
                  'title': 'Hakone Ekiden 2026 (20571).jpg',
                  'use': '18장 세로형 대안',
              },
              {
                  'filename': '19_akira_akasaki_berlin.jpg',
                  'title': 'Akira Akasaki at Berlin-Marathon 2025-09-21 01.jpg',
                  'use': '19장 — 일본 엘리트 마라토너',
              },
          ]

          def clean_html(value):
              if not value:
                  return ''
              value = html.unescape(value)
              value = re.sub(r'<br\s*/?>', ' ', value, flags=re.I)
              value = re.sub(r'<[^>]+>', '', value)
              return re.sub(r'\s+', ' ', value).strip()

          def api_image_info(title):
              params = {
                  'action': 'query',
                  'format': 'json',
                  'formatversion': '2',
                  'prop': 'imageinfo',
                  'iiprop': 'url|size|mime|extmetadata',
                  'titles': f'File:{title}',
              }
              url = API + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': USER_AGENT})
              with urllib.request.urlopen(req, timeout=45) as resp:
                  data = json.load(resp)
              pages = data.get('query', {}).get('pages', [])
              if not pages or pages[0].get('missing'):
                  raise RuntimeError(f'Commons file not found: {title}')
              info = pages[0].get('imageinfo', [])
              if not info:
                  raise RuntimeError(f'No imageinfo returned: {title}')
              return info[0]

          manifest = []
          failures = []

          for idx, asset in enumerate(assets, start=1):
              title = asset['title']
              try:
                  info = api_image_info(title)
                  original_url = info['url']
                  target = OUT / asset['filename']
                  req = urllib.request.Request(original_url, headers={'User-Agent': USER_AGENT})
                  with urllib.request.urlopen(req, timeout=120) as resp, target.open('wb') as f:
                      shutil.copyfileobj(resp, f)

                  if target.stat().st_size < 1024:
                      raise RuntimeError(f'Downloaded file is unexpectedly small: {target.stat().st_size} bytes')

                  ext = info.get('extmetadata', {})
                  def meta(name):
                      return clean_html(ext.get(name, {}).get('value', ''))

                  page_url = 'https://commons.wikimedia.org/wiki/File:' + urllib.parse.quote(title.replace(' ', '_'))
                  manifest.append({
                      'filename': asset['filename'],
                      'title': title,
                      'planned_use': asset['use'],
                      'commons_page': page_url,
                      'original_url': original_url,
                      'width': info.get('width'),
                      'height': info.get('height'),
                      'size_bytes': target.stat().st_size,
                      'mime': info.get('mime'),
                      'author': meta('Artist'),
                      'credit': meta('Credit'),
                      'license': meta('LicenseShortName'),
                      'license_url': meta('LicenseUrl'),
                      'description': meta('ImageDescription'),
                  })
                  print(f'[{idx:02d}/{len(assets)}] downloaded {asset["filename"]}')
                  time.sleep(0.2)
              except Exception as exc:
                  failures.append({'title': title, 'filename': asset['filename'], 'error': str(exc)})
                  print(f'FAILED: {title}: {exc}')

          (OUT / 'manifest.json').write_text(
              json.dumps({'assets': manifest, 'failures': failures}, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )

          lines = [
              '# 일본 마라톤 캐러셀 이미지 출처',
              '',
              'Wikimedia Commons의 원본 파일을 자동 다운로드해 묶은 자료입니다.',
              '각 이미지 사용 시 아래의 작가·라이선스·원문 페이지 정보를 유지하세요.',
              '',
          ]
          for item in manifest:
              lines.extend([
                  f'## {item["filename"]}',
                  f'- 예정 용도: {item["planned_use"]}',
                  f'- Commons 파일: {item["title"]}',
                  f'- 작가: {item["author"] or "페이지 확인"}',
                  f'- 라이선스: {item["license"] or "페이지 확인"}',
                  f'- 라이선스 URL: {item["license_url"] or "페이지 확인"}',
                  f'- 파일 페이지: {item["commons_page"]}',
                  f'- 원본 파일: {item["original_url"]}',
                  f'- 크기: {item["width"]} × {item["height"]}',
                  '',
              ])
          if failures:
              lines.extend(['# 다운로드 실패', ''])
              for item in failures:
                  lines.append(f'- {item["filename"]}: {item["title"]} — {item["error"]}')
          (OUT / 'IMAGE_CREDITS.md').write_text('\n'.join(lines), encoding='utf-8')

          readme = [
              '일본 마라톤 카드뉴스용 이미지 번들',
              '',
              f'성공: {len(manifest)}개',
              f'실패: {len(failures)}개',
              '',
              'IMAGE_CREDITS.md에서 이미지별 작가·라이선스·파일 페이지를 확인하세요.',
          ]
          (OUT / 'README_KO.txt').write_text('\n'.join(readme), encoding='utf-8')

          if failures:
              raise SystemExit(f'{len(failures)} download(s) failed; see bundle/manifest.json')
          PY

      - name: Upload image bundle
        uses: actions/upload-artifact@v4
        with:
          name: japan-marathon-carousel-images
          path: bundle/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
